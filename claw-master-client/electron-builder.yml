appId: com.claw-master.client
productName: Claw Master
electronLanguages:
  - zh-CN
  - zh-TW
  - en-US
  - ja
  - ru
  - de
directories:
  buildResources: build
  output: dist

protocols:
  - name: Claw Master
    schemes:
      - clawmaster

files:
  - out/**/*
  - "!**/*.{iml,o,hprof,orig,pyc,pyo,rbc,swp,csproj,sln,xproj}"
  - "!**/*.{map,ts,tsx,jsx,less,scss,sass,css.d.ts,d.cts,d.mts,md,markdown,yaml,yml}"
  - "!**/{test,tests,__tests__,powered-test,coverage}/**"
  - "!**/{example,examples}/**"
  - "!**/*.{spec,test}.{js,jsx,ts,tsx}"
  - "!**/*.min.*.map"
  - "!**/*.d.ts"

asarUnpack:
  - "**/*.{metal,exp,lib}"

win:
  target:
    - target: portable

portable:
  artifactName: ${productName}-${version}-${arch}-portable.${ext}

mac:
  target:
    - target: dmg

linux:
  target:
    - target: AppImage
# Claw Master 版本管理规则
# 适用于 client 和 server 两个子项目

[version]
# 版本格式: v{Major}.{Minor}.{Patch}(Build {Date}{Suffix})
# 示例: v1.0.1(Build 20260618a)

# Suffix 规则: a=1, b=2, c=3, ..., z=26, aa=27, ab=28, ...
suffix_base = 26

[rules]
# 每次 build: 递增末尾计数器 (a→b→c...)
build_increment = "suffix"

# 新功能增加: Minor+1, Patch 复位为 0
feature_increment = "minor"

# 架构变动 或 Minor 到达 100 时: Major+1, Minor 和 Patch 复位为 0
major_increment = "major"

# Minor 达到此值时触发 Major 递增
minor_threshold = 100

[build]
# 清理旧构建: 只保留最新版本
clean_old_builds = true

# 输出目录
output_dir = "dist"

# 保留的构建产物模式
keep_patterns = ["win-unpacked", "*.exe", "*.dmg", "*.AppImage"]